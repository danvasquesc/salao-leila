<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Painel Operacional | Salão Leila</title>

    <link
            rel="stylesheet"
            href="../css/reset.css"
    >

    <link
            rel="stylesheet"
            href="../css/variables.css"
    >

    <link
            rel="stylesheet"
            href="../css/global.css"
    >

    <link
            rel="stylesheet"
            href="../css/operacional.css"
    >
</head>

<body>

<header class="header">
    <div class="container header-content">

        <a href="../index.html" class="brand">
            <span class="brand-title">
                Cabeleleila Leila
            </span>

            <span class="brand-subtitle">
                Sistema de Agendamentos
            </span>
        </a>

        <nav class="navigation">

            <a href="../index.html">
                Início
            </a>

            <form
                    action="/logout"
                    method="post"
            >

                <button
                        type="submit"
                        class="nav-button"
                >
                    Sair
                </button>

            </form>

        </nav>

    </div>
</header>

<main class="page">

    <div class="container">

        <section class="page-header">
            <h1 class="page-title">
                Painel Operacional
            </h1>

            <p class="page-description">
                Acompanhe os agendamentos e serviços do salão.
            </p>
        </section>

        <section class="agenda-filter">

            <div class="filter-field">

                <label for="dataAgenda">
                    Data da agenda
                </label>

                <input
                        type="date"
                        id="dataAgenda"
                        name="dataAgenda"
                >

            </div>

            <button
                    id="buscarAgenda"
                    class="button button-primary"
                    type="button"
            >
                Buscar agenda
            </button>

        </section>

        <section class="agenda-summary">

            <div>
                <span class="summary-label">
                    Agendamentos encontrados
                </span>

                <strong
                        id="totalAgendamentos"
                        class="summary-value"
                >
                    0
                </strong>
            </div>

        </section>

        <div
                id="mensagem"
                class="message-container"
        ></div>

        <section
                id="listaAgendamentos"
                class="appointments"
        ></section>

    </div>

</main>

<dialog
        id="modalEditarAgendamento"
        class="edit-dialog"
>

    <div class="edit-dialog-content">

        <div class="edit-dialog-header">

            <div>
                <span class="edit-dialog-label">
                    Alteração operacional
                </span>

                <h2>
                    Alterar agendamento
                </h2>
            </div>

            <button
                    id="fecharEdicao"
                    type="button"
                    class="dialog-close"
                    aria-label="Fechar"
            >
                ×
            </button>

        </div>

        <p class="edit-dialog-description">
            Utilize esta opção para registrar alterações
            solicitadas diretamente ao salão.
        </p>

        <div
                id="mensagemEdicao"
                class="message-container"
        ></div>

        <form id="formEditarAgendamento">

            <div class="edit-grid">

                <div class="edit-field">

                    <label for="editarData">
                        Data
                    </label>

                    <input
                            type="date"
                            id="editarData"
                            required
                    >

                </div>

                <div class="edit-field">

                    <label for="editarHorario">
                        Horário
                    </label>

                    <input
                            type="time"
                            id="editarHorario"
                            required
                    >

                </div>

            </div>

            <fieldset class="edit-services">

                <legend>
                    Serviços
                </legend>

                <div
                        id="editarServicos"
                        class="edit-services-list"
                ></div>

            </fieldset>

            <div class="edit-actions">

                <button
                        id="cancelarEdicao"
                        type="button"
                        class="button"
                >
                    Cancelar
                </button>

                <button
                        id="salvarEdicao"
                        type="submit"
                        class="button button-primary"
                >
                    Salvar alteração
                </button>

            </div>

        </form>

    </div>

</dialog>

<script src="../js/api.js"></script>
<script src="../js/operacional.js"></script>

</body>

</html>
